name: Build Button Sim (WolfCraft Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: button-sim-rust-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
          cargo install cargo-apk --locked
      - name: Test game economy
        run: |
          rustc --edition=2024 --test src/game.rs -o /tmp/button-sim-game-tests
          /tmp/button-sim-game-tests
      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo apk build --lib --target aarch64-linux-android
          mkdir -p build
          find target -name '*.apk' -print
          APK="$(find target -name '*.apk' -type f | head -1)"
          test -n "$APK"
          cp "$APK" build/button-sim.apk
      - name: Align, sign and verify APK
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 build/button-sim.apk build/button-sim-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/button-sim-signed.apk build/button-sim-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose build/button-sim-signed.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 build/button-sim-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: button-sim-apk
          path: build/button-sim-signed.apk
          if-no-files-found: error
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk build/button-sim-signed.apk --clobber
            gh release edit latest-apk --notes "WolfCraft Rust build: $GITHUB_SHA"
          else
            gh release create latest-apk build/button-sim-signed.apk --title "Button Sim — WolfCraft Engine" --notes "WolfCraft Rust build: $GITHUB_SHA" --latest
          fi
