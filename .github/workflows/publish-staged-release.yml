name: Publish verified staged release
on:
  push:
    branches: [main]
    paths: [release-staging.json]
  workflow_dispatch:
    inputs:
      config_blob:
        description: "Git blob SHA of the signed release staging manifest"
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: button-sim-release-ota
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CONFIG_BLOB: ${{ inputs.config_blob }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch and verify staged release
        run: python3 tools/publish_staged.py
      - name: Verify APK and actual signed OTA
        run: |
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs build/button-sim-release.apk | tee /tmp/apk-signature.txt
          grep -F "certificate SHA-256 digest: f57b73cec072c6ca688126dfb34c8eb42f2780f357d8146b01fdce7feb2b0477" /tmp/apk-signature.txt
          "$TOOLS/zipalign" -c -P 16 4 build/button-sim-release.apk
          python3 tools/check_shell_apk.py game build/button-sim-release.apk
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar || curl -fsSL --retry 3 https://maven-central.storage-download.googleapis.com/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  /tmp/json.jar" | sha256sum -c -
          javac --release 17 -cp /tmp/json.jar -d /tmp/ota-classes android-shared/src/main/java/com/dozyfj/buttonsim/ota/BundleVerifier.java tools/OtaBundleSmokeTest.java
          java -ea -cp /tmp/ota-classes:/tmp/json.jar OtaBundleSmokeTest game build/game-ota build/release-cert.der
      - name: Publish verified APK and OTA
        run: |
          gh release upload latest-apk build/button-sim-release.apk --clobber
          gh release upload game-ota build/game-ota/game-runtime.zip build/game-ota/game-ota.sig build/game-ota/game-ota.json --clobber
          gh release edit latest-apk --title "Button Sim Release" --notes "Verified release and OTA core: $PUBLISHED_CORE_REVISION. Compatible updates: Pause → Обновить игру (OTA)."
          gh release edit game-ota --notes "Signed native core: $PUBLISHED_CORE_REVISION. Pause → Обновить игру (OTA)."

